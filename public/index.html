<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅ナビAI｜門司港レトロ限定</title>
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:16px;line-height:1.6;color:#222}
.card{border:1px solid #d5dce2;border-radius:12px;padding:16px;margin:14px 0}
button{padding:10px 16px;border:0;border-radius:8px;background:#145a75;color:white;font-size:1rem;cursor:pointer}
button:disabled{opacity:.5}.hint{color:#555;font-size:.92rem}.candidate{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}
#preview{max-width:100%;height:auto;display:none;margin-top:12px}.stamp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stamp-item{border:1px dashed #aaa;padding:10px;border-radius:8px}.stamped{background:#e8f5e9;border-color:#2e7d32}
label{display:block;margin:10px 0}#resultText{white-space:pre-wrap}
</style>
<!-- EXIF GPSを読むために利用。GPSはチェック時のみ判定に使用します。 -->
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
</head>
<body>
<h1>旅ナビAI 🐾</h1>
<p>門司港レトロ地区の観光スポットを写真から判定します。</p>
<div class="card">
<h2>1. 写真を撮影・選択</h2>
<input type="file" id="cameraInput" accept="image/*" capture="environment">
<img id="preview" alt="選択した写真のプレビュー">
<label><input type="checkbox" id="useGps"> GPSを利用して判定する（画像の位置情報を優先し、なければ端末の現在位置を確認）</label>
<p class="hint">GPSを使う場合、ブラウザから位置情報の許可を求められることがあります。画像を選んだだけでは端末の現在位置は取得しません。</p>
<button id="identifyBtn" disabled>判定する</button>
</div>
<div class="card"><h2>2. 判定結果</h2><div id="resultText">写真をアップロードしてください。</div><div id="candidates"></div><button id="stampBtn" hidden>スタンプを押す！</button></div>
<div class="card"><h2>3. スタンプ帳 <span id="completionRate"></span></h2><div id="stampGrid" class="stamp-grid"></div></div>
<script>
let visitorId=localStorage.getItem('tabinavi_visitor_id');
if(!visitorId){visitorId=crypto.randomUUID();localStorage.setItem('tabinavi_visitor_id',visitorId);}
let currentImageDataUrl=null, selectedFile=null, detectedSpotId=null, allSpots=[], myStamps=[];
const $=id=>document.getElementById(id);
const cameraInput=$('cameraInput'),preview=$('preview'),identifyBtn=$('identifyBtn'),resultText=$('resultText'),stampBtn=$('stampBtn');
window.addEventListener('DOMContentLoaded',loadSpotsAndStamps);

cameraInput.addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 selectedFile=file; detectedSpotId=null;stampBtn.hidden=true;
 try{
   const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
   const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=dataUrl});
   const scale=Math.min(1,800/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
   canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   currentImageDataUrl=canvas.toDataURL('image/jpeg',.82);preview.src=currentImageDataUrl;preview.style.display='block';identifyBtn.disabled=false;
   resultText.textContent='写真を読み込みました。判定ボタンを押してください。';
 }catch(err){resultText.textContent='画像を読み込めませんでした。別の画像をお試しください。';}
});

async function getGps(file){
 // まず、画像ファイル自体に埋め込まれたGPS情報を読む。canvas化した画像ではなく元ファイルを使う。
 if(window.exifr && file){
   try{const exif=await window.exifr.gps(file);if(exif&&Number.isFinite(exif.latitude)&&Number.isFinite(exif.longitude))
     return {latitude:exif.latitude,longitude:exif.longitude,source:'画像のEXIF GPS'};}catch(e){}
 }
 // EXIF GPSがなければ、チェックを入れた場合のみ端末の現在位置を取得する。
 if(!navigator.geolocation)throw new Error('このブラウザでは位置情報を利用できません。');
 return await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(
   p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,source:'端末の現在位置'}),
   e=>reject(new Error(e.code===1?'位置情報の利用が許可されませんでした。':e.code===2?'現在位置を取得できませんでした。':'位置情報の取得がタイムアウトしました。')),
   {enableHighAccuracy:true,timeout:12000,maximumAge:0}));
}
identifyBtn.addEventListener('click',async()=>{
 if(!currentImageDataUrl)return;
 identifyBtn.disabled=true;stampBtn.hidden=true;detectedSpotId=null;$('candidates').innerHTML='';
 resultText.textContent='門司港レトロのスポットを解析しています…';
 try{
   let gps=null;
   if($('useGps').checked){
     resultText.textContent='GPS情報を確認しています…';
     gps=await getGps(selectedFile);
   }
   const res=await fetch('/api/identify',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({imageDataUrl:currentImageDataUrl,useGps:$('useGps').checked,gps})});
   const data=await res.json();
   if(!res.ok)throw new Error(data.error||'判定APIでエラーが発生しました。');
   resultText.textContent=(data.matched?'第一候補：'+data.spot.name:'場所を確定できませんでした。')+
     '\\n確信度：'+(data.confidence||'低')+'\\n'+(data.explanation||'')+
     (data.gpsMessage?'\\nGPS：'+data.gpsMessage:'')+
     (data.visualEvidence?'\\n画像の根拠：'+data.visualEvidence:'');
   const list=$('candidates');
   (data.candidates||[]).forEach((c,i)=>{
     const div=document.createElement('div');div.className='candidate';
     const title=document.createElement('strong');title.textContent=(i===0?'第一候補：':'類似候補：')+c.name;
     const desc=document.createElement('div');desc.textContent=(c.reason||c.description||'')+(c.confidence?'（候補確度：'+c.confidence+'）':'');
     div.append(title,desc);list.appendChild(div);
   });
   if(data.matched&&data.stampEligible&&data.spot?.id){detectedSpotId=data.spot.id;stampBtn.hidden=false;}
   else if(data.matched&&!data.stampEligible)resultText.textContent+='\\nGPSと画像の判定が一致しないため、スタンプ獲得は保留しています。';
 }catch(err){resultText.textContent='判定できませんでした。\\n'+err.message;}
 finally{identifyBtn.disabled=false;}
});
stampBtn.addEventListener('click',async()=>{
 if(!detectedSpotId)return;
 try{const res=await fetch('/api/stamps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitorId,spotId:detectedSpotId})});
 const data=await res.json().catch(()=>({}));
 if(res.ok){alert('スタンプを獲得しました！');stampBtn.hidden=true;await loadSpotsAndStamps();}
 else if(res.status===409)alert('すでに獲得済みのスタンプです。');else alert(data.error||'スタンプの保存に失敗しました。');
 }catch(e){alert('通信エラーが発生しました。');}
});
async function loadSpotsAndStamps(){
 try{
 const [sr,tr]=await Promise.all([fetch('/api/spots'),fetch(`/api/stamps/${visitorId}`)]);
 const sd=await sr.json(),td=await tr.json();allSpots=Array.isArray(sd)?sd:(sd.spots||[]);myStamps=Array.isArray(td)?td:(td.stamps||[]);
 const stamped=new Set(myStamps.map(s=>s.spot_id));$('stampGrid').innerHTML='';
 allSpots.forEach(s=>{const d=document.createElement('div');d.className='stamp-item'+(stamped.has(s.id)?' stamped':'');d.textContent=s.name+'：'+(stamped.has(s.id)?'獲得済み':'未獲得');$('stampGrid').appendChild(d);});
 const rate=allSpots.length?Math.round(stamped.size/allSpots.length*100):0;$('completionRate').textContent=`(${stamped.size}/${allSpots.length}・${rate}%)`;
 }catch(e){$('stampGrid').textContent='スポット一覧を読み込めませんでした。';}
}
</script>
</body></html>
